name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platforms
        run: sdkmanager 'platforms;android-35' 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          ./gradlew :core:jvmTest :core:jsNodeTest \
            :core:compileKotlinIosArm64 :core:compileKotlinIosSimulatorArm64 \
            :android:lintDebug :android:assembleRelease \
            :example:lintDebug :example:assembleDebug
      - name: Verify published artifacts
        env:
          GNUPGHOME: ${{ runner.temp }}/tmark-ci-gnupg
        run: |
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          gpg --batch --generate-key <<'EOF'
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: sign
          Name-Real: TMark CI
          Name-Email: ci@example.invalid
          Expire-Date: 1d
          %no-protection
          %commit
          EOF
          ./gradlew :core:publishToMavenLocal :android:publishToMavenLocal \
            -Dmaven.repo.local="$RUNNER_TEMP/tmark-m2"
          python3 .github/scripts/check_publications.py "$RUNNER_TEMP/tmark-m2"
